<!doctype html><html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dhund News Social media</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@700&family=Noto+Naskh+Arabic:wght@700&family=Noto+Nastaliq+Urdu:wght@700&family=Oswald:wght@700&family=Poppins:wght@700&family=Roboto:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>:root{--bg:#0e0c0c;--p:#181414;--p2:#231d1d;--b:#352c2b;--a:#e11d2e;--a2:#ff3b4d;--y:#ffc72c;--t:#f3eeee;--m:#a99f9e}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(1000px 500px at 85% -10%,#2f1215,transparent),var(--bg);color:var(--t)}
.top{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--b);background:#120f0f}.top i{width:8px;height:24px;border-radius:3px;background:linear-gradient(var(--a),var(--y))}.top b{font-size:18px}.top small{color:var(--m);margin-left:auto}
main{display:grid;grid-template-columns:minmax(340px,460px) 1fr;gap:18px;padding:16px;max-width:1400px;margin:auto;align-items:start}
#ctl{order:1;min-width:0}#pv{order:2;position:sticky;top:12px;min-width:0}
#stage{display:grid;place-items:center;background:#0a0909;border:1px solid var(--b);border-radius:16px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
canvas{max-width:100%;max-height:calc(100dvh - 150px);width:auto;height:auto;border-radius:8px;background:#222}
#bar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}#bar span{flex:1;text-align:center;color:var(--m);font-size:12px;min-width:80px}#bar button{margin:0}
details{background:var(--p);border:1px solid var(--b);border-radius:14px;margin:10px 0;padding:0 14px 14px;transition:border-color .2s}details:hover{border-color:#4d403e}
summary{font-weight:700;cursor:pointer;padding:13px 14px;margin:0 -14px;list-style:none;display:flex;justify-content:space-between;border-radius:14px;transition:color .2s}summary:hover{color:var(--y)}
summary::-webkit-details-marker{display:none}summary:after{content:"+";color:var(--y);font-size:18px}details[open] summary:after{content:"\2212"}
label{display:block;margin:10px 0 3px;font-size:12px;color:var(--m)}
input,select,textarea{width:100%;background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:9px;font:inherit;transition:border-color .15s,background .15s}
input:hover,select:hover,textarea:hover{border-color:#5a4a48}input:focus,select:focus,textarea:focus{outline:2px solid var(--y);outline-offset:1px}
input[type=color]{padding:2px;height:38px;cursor:pointer}input[type=range]{padding:0;accent-color:var(--a);cursor:pointer}input[type=checkbox]{width:auto;margin-right:6px}
button{font:inherit;font-weight:600;color:#fff;border:1px solid transparent;border-radius:10px;padding:9px 16px;margin:6px 6px 0 0;cursor:pointer;background:linear-gradient(180deg,var(--a2),var(--a));box-shadow:0 2px 8px rgba(225,29,46,.25);transition:transform .15s,box-shadow .15s,background .15s,border-color .15s,filter .15s,color .15s}
button:hover{transform:translateY(-1px);filter:brightness(1.1);box-shadow:0 6px 16px rgba(225,29,46,.4)}
button:active{transform:scale(.97)}button:focus-visible{outline:2px solid var(--y);outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
button.g{background:var(--p2);border-color:var(--b);box-shadow:none;color:var(--t)}button.g:hover{border-color:var(--y);color:var(--y);background:#2c2424;box-shadow:0 4px 12px rgba(0,0,0,.4)}
button.y{background:linear-gradient(180deg,#ffd75e,var(--y));color:#1a1200;box-shadow:0 2px 8px rgba(255,199,44,.25)}button.y:hover{box-shadow:0 6px 16px rgba(255,199,44,.45)}
button.sm{padding:6px 12px;font-size:12px;margin:0}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
#st{display:inline-block;font-size:12px;color:var(--y);margin-top:6px}
#pgw{height:6px;background:var(--p2);border-radius:9px;overflow:hidden;margin-top:10px}#pg{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--y));transition:width .2s}
#tabs{display:flex;gap:4px;background:var(--p2);padding:4px;border-radius:12px;margin:6px 0}
.tab{flex:1;margin:0;background:transparent;box-shadow:none;color:var(--m);padding:7px}.tab:hover{color:var(--t);background:#2f2727;box-shadow:none;transform:none}.tab.on,.tab.on:hover{background:var(--a);color:#fff}
#chs{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto;margin:8px 0;padding:2px}
.ch{background:var(--p2);border:1px solid var(--b);color:var(--t);border-radius:999px;padding:5px 12px;margin:0;font-size:12px;font-weight:500;box-shadow:none}
.ch:hover{border-color:var(--y);color:var(--y);background:#2c2424;box-shadow:none}.ch.on,.ch.on:hover{background:var(--a);border-color:var(--a);color:#fff}
.card{display:flex;gap:10px;background:var(--p2);border:1px solid var(--b);border-radius:12px;padding:10px;margin:10px 0;transition:border-color .2s,transform .2s,box-shadow .2s}
.card:hover{border-color:#6a5855;transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.35)}.card.on{border-color:var(--y);box-shadow:0 0 0 1px var(--y)}
.card img{width:90px;height:90px;object-fit:cover;border-radius:8px;cursor:pointer;background:#333;flex:none;transition:filter .2s}.card img:hover{filter:brightness(1.15)}
.card>div{flex:1;min-width:0}.card textarea{margin-bottom:6px;background:var(--p)}.card .acts{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:900px){main{display:block;padding:10px}#pv{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}canvas{max-height:38dvh}#stage{padding:6px}.top small{display:none}}
@media(max-width:520px){.card{flex-direction:column}.card img{width:100%;height:160px}.row{flex-wrap:wrap}.row>*{flex:1 1 90px}}
</style></head><body><header class="top"><i></i><b>Dhund News</b><small>Social media poster studio</small></header><main>
<section id="pv"><div id="stage"><canvas id="cv" width="1080" height="1350"></canvas></div>
<div id="bar"><button id="prv" class="g">◀</button><span id="dim"></span><button id="nxt" class="g">▶</button><button id="dlp" class="g">⬇ PNG</button><button id="zipi" class="y">⬇ Sari images ZIP</button></div></section>
<section id="ctl">
<details open><summary>01 RSS feed se poster</summary>
<label>RSS / XML link</label><input id="feed" placeholder="https://.../feed.xml">
<label>Channel chunein (click karte hi khabrein aa jayengi)</label><div id="tabs"><button class="tab on" data-r="All">Sab</button><button class="tab" data-r="Pakistan">Pakistan</button><button class="tab" data-r="International">International</button></div><input id="fsrch" placeholder="Channel dhoondhein..."><div id="chs"></div>
<label>Ya XML yahan paste karein (link ho to khali chhorein)</label><textarea id="xml" dir="auto" rows="3"></textarea>
<label>Kitne poster</label><input id="cnt" type="number" value="10" min="1" max="30">
<button id="load">Khabrein lao</button> <span id="st"></span>
<div><button id="zip" class="g">Images + text ZIP</button><button id="cpall" class="g">Sab text copy</button></div><div id="pgw" hidden><div id="pg"></div></div>
<div id="list"></div></details>
<details><summary>02 Photo, template, logo</summary>
<label>Background photo (RSS na ho to)</label><input id="bgf" type="file" accept="image/*"><button id="rbg" class="g">Photo hatao</button>
<label>Template / frame (PNG)</label><input id="tplf" type="file" accept="image/*"><button id="rtpl" class="g">Template hatao</button>
<label>Template opacity</label><input id="tplo" type="range" min="0" max="100" value="100">
<label>Photo size</label><input id="ps" type="range" min="30" max="300" value="100">
<div class="row"><div><label>Photo horizontal</label><input id="px" type="range" min="-100" max="100" value="0"></div><div><label>Photo vertical</label><input id="py" type="range" min="-100" max="100" value="0"></div></div>
<label><input id="shade" type="checkbox" checked> Neeche dark shade (text saaf parhne ke liye)</label>
<label><input id="lon" type="checkbox" checked> Logo dikhao</label>
<label>Apna logo (default: assets/dhund-logo.png)</label><input id="logof" type="file" accept="image/*">
<label><input id="lkey" type="checkbox"> Logo ka green screen hatao</label>
<div class="row"><div><label>Green screen color</label><input id="lkc" type="color" value="#00ff00"></div><div><label>Hatane ki taqat</label><input id="lkt" type="range" min="5" max="100" value="45"></div></div>
<label>Logo size</label><input id="ls" type="range" min="20" max="300" value="100">
<label>Logo opacity</label><input id="lo" type="range" min="0" max="100" value="100">
<label>Logo position</label><select id="lpos"><option value="0,0">Top left<option value="1,0">Top center<option value="2,0">Top right<option value="0,1">Middle left<option value="1,1">Center<option value="2,1">Middle right<option value="0,2">Bottom left<option value="1,2">Bottom center<option value="2,2">Bottom right</select></details>
<details><summary>03 Headline aur text</summary>
<label>Headline (words ko *star* ke beech likhein to highlight hon)</label><textarea id="hl" dir="auto" rows="3">Yahan apni *headline* likhein</textarea>
<label>Handle / website</label><input id="hdl" placeholder="@dhundnews">
<label><input id="hle" type="checkbox" checked> Highlight chalao</label>
<div class="row"><div><label>Text</label><input id="c1" type="color" value="#ffffff"></div><div><label>Highlight bg</label><input id="c2" type="color" value="#ffc72c"></div><div><label>Highlight text</label><input id="c3" type="color" value="#000000"></div></div>
<div class="row"><div><label>Alignment</label><select id="al"><option value="center">Center<option value="left">Left<option value="right">Right</select></div><div><label>Position</label><select id="pos"><option value="bottom">Bottom<option value="middle">Middle<option value="top">Top</select></div></div>
<label>Text size</label><input id="fs" type="range" min="30" max="160" value="76">
<label>Font</label><select id="ff"><option value="auto">Auto (Urdu = Nastaliq, baaqi = Poppins)<option value='"Noto Nastaliq Urdu"'>Noto Nastaliq Urdu<option value='"Noto Naskh Arabic"'>Noto Naskh<option>Poppins<option>Montserrat<option>Roboto<option>Oswald<option>Anton<option>Arial<option>Impact<option>Tahoma<option>Georgia</select>
<label>Apna font (.ttf .otf .woff .woff2)</label><input id="fontf" type="file" accept=".ttf,.otf,.woff,.woff2"></details>
<details><summary>04 Poster size</summary><label>Export quality</label><select id="xq"><option value="1">Standard (1x)<option value="2">High (2x, zyada saaf)</select><label>Poster size</label><select id="sz"><option value="1080x1350">Instagram 4:5<option value="1080x1080">Square 1:1<option value="1080x1920">Story / Reel 9:16<option value="1200x630">Facebook 1200x630<option value="1280x720">YouTube 16:9<option value="tpl">Template ke size ka<option value="c">Custom</option></select>
<div class="row" id="cs" hidden><input id="cw" type="number" value="1080"><input id="ch" type="number" value="1350"></div></details>
</section></main>
<script>
const $=id=>document.getElementById(id),cv=$('cv');
let items=[],sel=-1,bg=null,tpl=null,logo=null,cache={};
const px_='/.netlify/functions/proxy?url=';
const fileImg=f=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=URL.createObjectURL(f)});
const file_=location.protocol=='file:',hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function pic(x,img,dx,dy,w,h){let s=img,sw=img.width,sh=img.height;
 while(sw/2>w&&sh/2>h){const c=document.createElement('canvas');c.width=sw=Math.ceil(sw/2);c.height=sh=Math.ceil(sh/2);const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(s,0,0,sw,sh);s=c}
 x.drawImage(s,dx,dy,w,h)}
function up(u){try{let s=u.replace(/^http:/,'https:');
 s=s.replace(/([-_])\d{2,4}x\d{2,4}(?=\.(jpe?g|png|webp)(\?|$))/i,'');
 s=s.replace(/(i\.dawn\.com\/)(thumbnail|small|medium)\//,'$1large/');
 s=s.replace(/(ichef\.bbci\.co\.uk\/(?:news|ace\/standard))\/\d+\//,(m,a)=>a+(a.includes('ace')?'/976/':'/1024/'));
 const o=new URL(s);['w','width','resize','fit','h','height','quality'].forEach(k=>o.searchParams.delete(k));return o.href}catch{return u}}
async function getHtml(u){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),12000),r=await fetch(px_+encodeURIComponent(u),{signal:c.signal});clearTimeout(t);return r.ok?await r.text():''}catch{return''}}
async function bestImg(i){let im=i.img?await loadImg(i.img):null;
 if((!im||im.width<900)&&i.link&&!file_){const h=await getHtml(i.link);
  if(h){const m=new DOMParser().parseFromString(h,'text/html').querySelector('meta[property="og:image"],meta[name="twitter:image"]'),u=m&&m.content;
   if(u){try{const o=await loadImg(new URL(u,i.link).href);if(o&&(!im||o.width>im.width))im=o}catch{}}}}
 return im}
function loadImg(u){return cache[u]||(cache[u]=new Promise(res=>{
 const L=[...new Set([up(u),u])];if(/^https?:/.test(u)){if(!file_)L.push(px_+encodeURIComponent(u));L.push('https://images.weserv.nl/?url='+encodeURIComponent(u))}
 const t=k=>{if(k>=L.length)return res(null);const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>t(k+1);i.src=L[k]};t(0)}))}
async function getXml(u){const L=[];if(!file_)L.push(px_+encodeURIComponent(u));L.push('https://api.allorigins.win/raw?url='+encodeURIComponent(u),'https://corsproxy.io/?'+encodeURIComponent(u));
 for(const p of L){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),15000),r=await fetch(p,{signal:c.signal});clearTimeout(t);if(!r.ok)continue;const x=await r.text();if(/<(rss|feed|rdf)/i.test(x))return x}catch{}}
 throw Error('Feed nahi mili (internet ya channel ka masla)')}
function dims(){const v=$('sz').value;if(v=='tpl'&&tpl)return[tpl.width,tpl.height];if(v=='c')return[+$('cw').value||1080,+$('ch').value||1350];if(v=='tpl')return[1080,1350];return v.split('x').map(Number)}
function rr(x,a,b,w,h,r){x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h);x.fill()}
async function draw(c,hd,photo,k=1){
 let[W,H]=dims();W=Math.round(W*k);H=Math.round(H*k);c.width=W;c.height=H;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
 x.fillStyle='#1a1a1a';x.fillRect(0,0,W,H);
 const img=photo||bg;
 if(img){const s=Math.max(W/img.width,H/img.height)*$('ps').value/100,w=img.width*s,h=img.height*s;
  pic(x,img,(W-w)/2+$('px').value*W/100,(H-h)/2+$('py').value*H/100,w,h)}
 if(tpl){x.globalAlpha=$('tplo').value/100;x.drawImage(tpl,0,0,W,H);x.globalAlpha=1}
 if($('shade').checked){const g=x.createLinearGradient(0,H*.35,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.88)');x.fillStyle=g;x.fillRect(0,H*.35,W,H*.65)}
 if(logo&&$('lon').checked){const s=Math.min(W*.26/logo.width,H*.12/logo.height)*$('ls').value/100,w=logo.width*s,h=logo.height*s,m=W*.025,p=$('lpos').value.split(',');
  x.globalAlpha=$('lo').value/100;x.drawImage(logo,p[0]==0?m:p[0]==1?(W-w)/2:W-w-m,p[1]==0?m:p[1]==1?(H-h)/2:H-h-m,w,h);x.globalAlpha=1}
 const rtl=/[\u0600-\u06FF]/.test(hd),v=$('ff').value,fam=v=='auto'?(rtl?'"Noto Nastaliq Urdu"':'Poppins'):v,fs=$('fs').value*W/1080,font=`700 ${fs}px ${fam},sans-serif`;
 try{await document.fonts.load(font,hd||'a')}catch{}
 x.font=font;x.textBaseline='middle';x.textAlign='left';
 const sp=x.measureText(' ').width,on=$('hle').checked,words=[];let h=false;
 for(const t of hd.split(/(\*|\s+)/)){if(t==='*')h=!h;else if(t&&t.trim())words.push({t,h:h&&on,w:x.measureText(t).width})}
 const lines=[[]];let w=0;
 for(const d of words){if(w+d.w>W*.86&&lines.at(-1).length){lines.push([]);w=0}lines.at(-1).push(d);w+=d.w+sp}
 const lh=fs*(rtl?1.9:1.35),hand=$('hdl').value.trim(),pos=$('pos').value,al=$('al').value;
 let y=pos=='top'?H*.12:pos=='middle'?(H-lines.length*lh)/2:H-lines.length*lh-H*(hand?.14:.08);
 for(const ln of lines){const lw=ln.reduce((a,d)=>a+d.w+sp,-sp),vis=rtl?[...ln].reverse():ln;
  let p=al=='center'?(W-lw)/2:al=='left'?W*.07:W*.93-lw,q=p;
  for(let i=0;i<vis.length;){if(!vis[i].h){q+=vis[i].w+sp;i++;continue}
   let j=i,e=q;while(j<vis.length&&vis[j].h){e+=vis[j].w+(j+1<vis.length&&vis[j+1].h?sp:0);j++}
   x.fillStyle=$('c2').value;rr(x,q-fs*.14,y+lh*.08,e-q+fs*.28,lh*.84,fs*.14);q=e+sp;i=j}
  for(const d of vis){x.fillStyle=d.h?$('c3').value:$('c1').value;x.fillText(d.t,p,y+lh*.5);p+=d.w+sp}
  y+=lh}
 if(hand){x.font=`700 ${W*.03}px ${fam},sans-serif`;x.fillStyle=$('c1').value;x.globalAlpha=.85;x.textAlign='center';x.fillText(hand,W/2,H*.955);x.globalAlpha=1}
}
let busy=false,again=false;
async function preview(){if(busy){again=true;return}busy=true;
 do{again=false;const it=items[sel];await draw(cv,it?it.headline:$('hl').value,it&&it.im?await it.im:null)}while(again);
 busy=false;$('dim').textContent=cv.width+' x '+cv.height}
const tx=(e,n)=>{const a=e.getElementsByTagName(n)[0];return a?a.textContent:''};
const clean=s=>(new DOMParser().parseFromString(s,'text/html').body.textContent||'').replace(/\s+/g,' ').trim();
const norm=s=>s.replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"');
const htmlImg=h=>{const m=new DOMParser().parseFromString(h,'text/html').querySelector('img');return m&&(m.getAttribute('src')||m.getAttribute('data-src'))||''};
function parse(xml){const d=new DOMParser().parseFromString(xml,'text/xml');if(d.querySelector('parsererror'))throw Error('XML sahi nahi hai');
 let L=[...d.getElementsByTagName('item')];if(!L.length)L=[...d.getElementsByTagName('entry')];
 return L.map(e=>{
  const lk=e.getElementsByTagName('link')[0],link=lk?(lk.textContent.trim()||lk.getAttribute('href')||''):'',c=[];
  for(const n of['content','thumbnail','enclosure'])for(const a of e.getElementsByTagNameNS('*',n)){
   const u=a.getAttribute('url');if(u&&!/video|audio/.test(a.getAttribute('type')||a.getAttribute('medium')||'')&&!/\.(mp3|mp4|m4a|mov)(\?|$)/i.test(u))c.push(u)}
  for(const k of['content:encoded','description','summary','content']){const u=htmlImg(tx(e,k));if(u)c.push(u)}
  let img=c.find(u=>!/thumb|[-_]\d{2,3}x\d{2,3}\.|small|icon|avatar/i.test(u))||c[0]||'';if(img){try{img=new URL(img.startsWith('//')?'https:'+img:img,link||undefined).href}catch{}}
  const title=clean(tx(e,'title'));let desc=clean(tx(e,'description')||tx(e,'summary')||tx(e,'content:encoded')||tx(e,'content'));
  if(norm(desc).toLowerCase().startsWith(norm(title).toLowerCase()))desc=desc.slice(title.length).trim();
  return{title,desc:desc.slice(0,700),img,link}}).filter(i=>i.title)}
const star=t=>{const w=t.split(/\s+/);return w.length<4?t:'*'+w.slice(0,2).join(' ')+'* '+w.slice(2).join(' ')};
const btn=(n,f)=>{const b=document.createElement('button');b.textContent=n;b.onclick=f;b.className='g sm';return b};
const copy=s=>navigator.clipboard.writeText(s).then(()=>$('st').textContent='Copy ho gaya');
function build(){const L=$('list');L.textContent='';items.forEach((it,i)=>{
 const d=document.createElement('div');d.className='card';
 const im=document.createElement('img');im.referrerPolicy='no-referrer';if(it.img){im.onerror=()=>{im.onerror=null;im.src=px_+encodeURIComponent(it.img)};im.src=it.img.replace(/^http:/,'https:')}im.onclick=()=>pick(i);
 const r=document.createElement('div'),t=document.createElement('textarea'),ds=document.createElement('textarea'),b=document.createElement('div');b.className='acts';
 t.dir=ds.dir='auto';t.rows=2;t.value=it.headline;t.oninput=()=>{it.headline=t.value;if(sel==i){$('hl').value=t.value;preview()}};
 ds.rows=4;ds.value=it.text;ds.oninput=()=>it.text=ds.value;it.ta=ds;
 b.append(btn('Dekho',()=>pick(i)),btn('PNG',()=>one(i)),btn('Text copy',()=>copy(ds.value)));
 r.append(t,ds,b);d.append(im,r);L.append(d);it.t=t})}
function pick(i){sel=i;$('hl').value=items[i].headline;document.querySelectorAll('.card').forEach((c,j)=>c.classList.toggle('on',j==i));preview()}
$('hl').oninput=()=>{if(sel>=0){items[sel].headline=$('hl').value;items[sel].t.value=$('hl').value}preview()};
$('load').onclick=async()=>{const st=$('st');st.textContent='Load ho raha hai...';
 try{let xml=$('xml').value.trim();
